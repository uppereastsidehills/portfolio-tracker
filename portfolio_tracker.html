<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Portfolio Tracker</title>
<style>
:root{--bg:#0f1117;--surface:#181c27;--surface2:#1f2436;--border:#2a3050;--accent:#4f8ef7;--warn:#e8a838;--danger:#e85c5c;--green:#4caf87;--text:#e8eaf0;--muted:#7a8099;--s1:#4f8ef7;--s2:#e8a838;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;}
header{padding:20px 24px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;}
header h1{font-size:18px;font-weight:700;}
header p{color:var(--muted);font-size:11px;margin-top:2px;}
.tabs{display:flex;gap:3px;padding:12px 24px 0;border-bottom:1px solid var(--border);overflow-x:auto;}
.tab{padding:7px 14px;border-radius:6px 6px 0 0;cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);border:1px solid transparent;border-bottom:none;white-space:nowrap;}
.tab.active{background:var(--surface);color:var(--text);border-color:var(--border);margin-bottom:-1px;}
.page{display:none;padding:20px 24px;}
.page.active{display:block;}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;}
.kpi label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.kpi .val{font-size:20px;font-weight:700;margin-top:3px;}
.kpi .sub{font-size:10px;color:var(--muted);margin-top:2px;}
.sec-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px;margin-top:14px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:14px;}
.card-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:12px 14px 0;}
table{width:100%;border-collapse:collapse;}
th{padding:9px 12px;text-align:left;font-size:10px;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);background:var(--surface2);}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:12px;}
tr:last-child td{border-bottom:none;}
.badge{display:inline-block;padding:2px 6px;border-radius:8px;font-size:10px;font-weight:600;}
.b-high{background:rgba(232,88,88,.15);color:var(--danger);}
.b-mid{background:rgba(232,168,56,.15);color:var(--warn);}
.b-low{background:rgba(76,175,135,.15);color:var(--green);}
.c-green{color:var(--green);} .c-danger{color:var(--danger);} .c-warn{color:var(--warn);} .c-accent{color:var(--accent);} .c-muted{color:var(--muted);}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
.bar-name{width:150px;font-size:11px;color:var(--muted);flex-shrink:0;line-height:1.3;}
.bar-track{flex:1;background:var(--surface2);border-radius:3px;height:16px;position:relative;}
.bar-fill{height:100%;border-radius:3px;}
.bar-label{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:600;color:var(--text);}
.target-mark{position:absolute;top:0;height:100%;width:2px;background:var(--danger);opacity:.8;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
.ldot{width:9px;height:9px;border-radius:2px;}
.info-box{background:rgba(79,142,247,.07);border:1px solid rgba(79,142,247,.2);border-radius:7px;padding:10px 13px;font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:14px;}
.info-box strong{color:var(--accent);}
.country-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
.country-name{width:140px;font-size:11px;flex-shrink:0;}
.country-track{flex:1;background:var(--surface2);border-radius:3px;height:14px;}
.country-fill{height:100%;border-radius:3px;}
.country-pct{width:44px;font-size:11px;font-weight:600;text-align:right;}
.country-eur{width:60px;font-size:10px;color:var(--muted);text-align:right;}
.country-group-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 7px;}
.period-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
.period-btn{padding:5px 12px;border-radius:16px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:11px;cursor:pointer;}
.period-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.etf-growth-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;}
.etf-growth-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.etf-growth-name{font-size:13px;font-weight:600;}
.etf-growth-val{font-size:18px;font-weight:700;}
.growth-track{background:var(--surface2);border-radius:3px;height:7px;margin-top:7px;}
.growth-fill{height:100%;border-radius:3px;background:var(--green);}
.growth-fill.neg{background:var(--danger);}
.etf-growth-meta{display:flex;gap:16px;margin-top:7px;flex-wrap:wrap;}
.etf-growth-meta span{font-size:10px;color:var(--muted);}
.etf-growth-meta strong{color:var(--text);}
.pscard{background:linear-gradient(135deg,rgba(79,142,247,.1),rgba(76,175,135,.05));border:1px solid rgba(79,142,247,.2);border-radius:10px;padding:16px;margin-bottom:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;}
.pscard-item label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.pscard-item .big{font-size:22px;font-weight:700;margin-top:2px;}
.pscard-item .small{font-size:10px;color:var(--muted);margin-top:1px;}
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px;}
.form-card h3{font-size:13px;font-weight:600;margin-bottom:12px;}
.field label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
.field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:7px 9px;color:var(--text);font-size:13px;outline:none;}
.field input:focus{border-color:var(--accent);}
.finput{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:6px 8px;color:var(--text);font-size:12px;outline:none;width:100%;}
.finput:focus{border-color:var(--accent);}
.btn{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:500;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.btn-danger-sm{background:rgba(232,88,88,.12);color:var(--danger);border:1px solid rgba(232,88,88,.25);border-radius:4px;padding:3px 7px;font-size:11px;cursor:pointer;}
.snap-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;}
.snap-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.snap-date{font-size:12px;font-weight:600;}
.snap-total{font-size:17px;font-weight:700;color:var(--accent);}
.snap-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.pill{font-size:10px;padding:2px 8px;border-radius:8px;background:var(--surface2);color:var(--muted);}
.sim-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.sim-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;}
.sim-card h3{font-size:13px;font-weight:600;margin-bottom:12px;}
.sim-etf-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.sim-result{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;}
.sim-result h3{font-size:13px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sim-cmp-row{display:grid;grid-template-columns:150px 1fr 70px 70px 60px;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:11px;}
.sim-cmp-row.hdr{font-size:10px;color:var(--muted);text-transform:uppercase;padding-bottom:7px;}
.sim-cmp-row:last-child{border-bottom:none;}
.sim-bar{background:var(--surface2);border-radius:3px;height:13px;position:relative;}
.sim-bar-b{position:absolute;top:0;left:0;height:100%;border-radius:3px;background:var(--muted);opacity:.35;}
.sim-bar-a{position:absolute;top:0;left:0;height:100%;border-radius:3px;opacity:.85;}
.sim-bar-lim{position:absolute;top:0;height:100%;width:2px;background:var(--danger);opacity:.8;}
.ok-badge{display:inline-block;padding:2px 7px;border-radius:8px;font-size:10px;font-weight:600;background:rgba(76,175,135,.15);color:var(--green);}
.warn-badge{display:inline-block;padding:2px 7px;border-radius:8px;font-size:10px;font-weight:600;background:rgba(232,88,88,.15);color:var(--danger);}
.warn-box{background:rgba(232,168,56,.08);border:1px solid rgba(232,168,56,.2);border-radius:6px;padding:8px 12px;font-size:11px;color:var(--warn);margin-bottom:12px;}
.clim{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:5px 7px;color:var(--text);font-size:11px;outline:none;width:70px;}
.clim:focus{border-color:var(--accent);}
.csel{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:5px 7px;color:var(--text);font-size:11px;outline:none;cursor:pointer;}
.csel:focus{border-color:var(--accent);}
.lim-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:11px;}
.lim-row:last-child{border-bottom:none;}
.lim-label{color:var(--muted);flex:1;}
.toast{position:fixed;bottom:18px;right:18px;background:var(--green);color:#fff;padding:8px 14px;border-radius:7px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;}
.no-data{text-align:center;padding:40px;color:var(--muted);}
.delta-pos{color:var(--green);}
.delta-neg{color:var(--danger);}

@media(max-width:768px){
  /* Base layout */
  body{font-size:13px;}
  header{padding:12px 14px 10px;flex-direction:column;align-items:flex-start;gap:4px;}
  header h1{font-size:16px;}

  /* Tabs - large touch targets for mobile */
  .tabs{
    padding:0;
    gap:0;
    border-bottom:2px solid var(--border);
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    background:var(--surface);
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    padding:14px 16px;
    font-size:13px;
    font-weight:500;
    border-radius:0;
    border:none;
    border-bottom:3px solid transparent;
    min-height:48px;
    display:flex;
    align-items:center;
    white-space:nowrap;
    flex-shrink:0;
  }
  .tab.active{
    background:var(--surface);
    color:var(--accent);
    border-bottom:3px solid var(--accent);
    margin-bottom:0;
  }

  /* Pages */
  .page{padding:12px 14px;}

  /* KPI rows - 2 columns on mobile */
  .kpi-row{grid-template-columns:repeat(2,1fr);gap:8px;}
  .kpi{padding:10px 12px;}
  .kpi .val{font-size:16px;}
  .kpi .sub{font-size:9px;}

  /* Hero Gesamtbild - single column */
  .page > div[style*="linear-gradient"] > div[style*="grid"]{
    grid-template-columns:repeat(2,1fr) !important;
  }

  /* Rendite 4er cards - 2x2 grid */
  .page > div[style*="linear-gradient"] > div[style*="grid-template-columns:repeat(4"]{
    grid-template-columns:repeat(2,1fr) !important;
  }

  /* Cards */
  .card{border-radius:6px;}
  .card-title{font-size:10px;padding:10px 12px 0;}

  /* Tables - horizontal scroll */
  .card > table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{font-size:11px;}
  th,td{padding:7px 8px !important;white-space:nowrap;}

  /* Bars */
  .bar-name{width:90px;font-size:10px;}
  .bar-track{min-width:80px;}
  .bar-label{font-size:9px;}

  /* Country rows */
  .country-name{width:100px;font-size:10px;}
  .country-pct{width:36px;font-size:10px;}
  .country-eur{width:50px;font-size:9px;}

  /* Section labels */
  .sec-label{font-size:9px;margin-top:10px;margin-bottom:5px;}

  /* Simulation */
  .sim-grid{grid-template-columns:1fr;}
  .sim-card{padding:12px;}
  .sim-cmp-row{grid-template-columns:110px 1fr 50px 50px 44px;font-size:10px;}

  /* Erfassen form */
  .form-card{padding:12px;}
  .form-card h3{font-size:12px;}
  .finput{font-size:12px;padding:5px 7px;}

  /* Erfassen table - scrollable */
  .form-card > table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}

  /* Entwicklung period buttons */
  .period-bar{gap:4px;}
  .period-btn{padding:4px 8px;font-size:10px;}

  /* ETF growth cards */
  .etf-growth-card{padding:10px;}
  .etf-growth-name{font-size:12px;}
  .etf-growth-val{font-size:16px;}
  .etf-growth-meta{gap:8px;}
  .etf-growth-meta span{font-size:9px;}

  /* Snap cards */
  .snap-card{padding:10px;}
  .snap-date{font-size:11px;}
  .snap-total{font-size:15px;}
  .snap-pills{gap:3px;}
  .pill{font-size:9px;padding:1px 5px;}

  /* Info box */
  .info-box{font-size:10px;padding:8px 10px;}

  /* Lim rows in simulation */
  .lim-row{font-size:10px;}
  .clim{width:55px;padding:4px 5px;}

  /* Screenshot/CSV buttons - stack vertically */
  div[style*="display:flex"][style*="gap:10px"]{flex-direction:column !important;}
}

@media(max-width:400px){
  .kpi-row{grid-template-columns:1fr;}
  th,td{padding:5px 6px !important;}
  .tab{padding:5px 8px;font-size:10px;}
}

</style>
</head>

// ── STORAGE ──────────────────────────────────────────────────────────
async function sGet(key) {
  try { if(window.storage && window.storage.get) { var r=await window.storage.get(key); if(r&&r.value) return r.value; } } catch(e){}
  try { return localStorage.getItem(key); } catch(e){}
  return null;
}
async function sSet(key,val) {
  try { if(window.storage && window.storage.set) { await window.storage.set(key,val); return; } } catch(e){}
  try { localStorage.setItem(key,val); } catch(e){}
}
// All historical storage keys - never remove old ones, only add new
var ALL_SNAP_KEYS = [
  'ptsnaps12','ptsnaps13','ptsnaps14','ptsnaps15','ptsnaps16',
  'ptsnaps17','ptsnaps18','ptsnaps19','ptsnaps20','ptsnaps21',
  'ptv1snaps','ptv2snaps','ptv3snaps','ptv4snaps','ptv5snaps',
  'ptv6snaps','ptv7snaps','ptv8snaps','ptv9snaps','ptv10snaps',
  'ptv11snaps','ptv12snaps','ptv13snaps','ptv14snaps','ptv15snaps',
  'ptv16snaps',
];
var CURRENT_KEY = 'ptv16snaps';

async function migrateSnapshots() {
  // Search all historical keys for snapshots
  var bestSnaps = null;
  var bestCount = 0;
  var bestKey = null;
  for(var ki=0; ki<ALL_SNAP_KEYS.length; ki++) {
    try {
      var raw = await sGet(ALL_SNAP_KEYS[ki]);
      if(!raw) continue;
      var parsed = JSON.parse(raw);
      if(!Array.isArray(parsed)||!parsed.length) continue;
      // Prefer the key with the most snapshots (most data)
      if(parsed.length > bestCount) {
        bestCount = parsed.length;
        bestSnaps = parsed;
        bestKey = ALL_SNAP_KEYS[ki];
      }
    } catch(e){}
  }
  if(bestSnaps && bestKey && bestKey !== CURRENT_KEY) {
    console.log('Migrated '+bestCount+' snapshots from '+bestKey+' to '+CURRENT_KEY);
    snapshots = bestSnaps;
    await persist();
    return true;
  }
  return false;
}

async function loadData() {
  // First try current key
  try {
    var r = await sGet(CURRENT_KEY);
    if(r) {
      var p = JSON.parse(r);
      if(Array.isArray(p) && p.length) {
        snapshots = p;
        return;
      }
    }
  } catch(e){}
  // Try migration from any historical key
  var migrated = await migrateSnapshots();
  if(migrated) return;
  // Fall back to seed data
  snapshots = JSON.parse(JSON.stringify(SNAPSHOTS_DEFAULT));
  await persist();
}
async function persist() { try { await sSet(CURRENT_KEY,JSON.stringify(snapshots)); } catch(e){} }

// ── CALCULATIONS ─────────────────────────────────────────────────────
function calcSnap(snap) {
  if(!snap||!snap.etfs||!snap.etfs.length) return {total:0,s1pct:0,s2pct:0,s1eur:0,s2eur:0,gewinnEur:0,einstand:0,cagr:0,avgMonate:0,steuer:0,netto:0,nettoPct:0,gesamtPct:0};
  var etfs=snap.etfs;
  var total=etfs.reduce(function(a,e){return a+e.wert;},0);
  var s1eur=0,s2eur=0,gewinnEur=0,einstandSum=0,mSum=0;
  var today=new Date();
  etfs.forEach(function(e){
    var t=TECH[e.isin]||{s1:0,s2a:0};
    s1eur+=e.wert*t.s1/100; s2eur+=e.wert*(t.s1+t.s2a)/100;
    // Use gewinnEur directly (entered from TR app) as source of truth
    // Use gewinnEur directly as entered from TR - no recalculation
    var gEur = e.gewinnEur !== undefined && e.gewinnEur !== 0 ? e.gewinnEur
               : e.gewinnPct ? e.wert * e.gewinnPct / (100 + e.gewinnPct) : 0;
    var eStand = e.wert - gEur;
    gewinnEur += gEur;
    einstandSum += eStand > 0 ? eStand : 0;
    var m = e.firstBuy ? ((today-new Date(e.firstBuy))/(1000*60*60*24*30.44)) : (e.monate||0);
    if(m < 0.5) m = 0.5;
    mSum+=(e.wert/total)*m;
  });
  var steuer=gewinnEur>0?gewinnEur*TAX:0;
  var netto=gewinnEur-steuer;
  var gesamtPct=einstandSum>0?gewinnEur/einstandSum*100:0;
  var nettoPct=einstandSum>0?netto/einstandSum*100:0;
  var cagr=einstandSum>0&&mSum>0?(Math.pow((einstandSum+gewinnEur)/einstandSum,12/mSum)-1)*100:0;
  return {total:total,s1pct:s1eur/total*100,s2pct:s2eur/total*100,s1eur:s1eur,s2eur:s2eur,
    gewinnEur:gewinnEur,einstand:einstandSum,cagr:cagr,avgMonate:mSum,
    steuer:steuer,netto:netto,nettoPct:nettoPct,gesamtPct:gesamtPct};
}

function calcGeo(etfs) {
  var total=etfs.reduce(function(a,e){return a+e.wert;},0);
  var res={USA:0,Europa:0,Japan:0,China:0,EM_Rest:0,Kanada:0,Australien:0,Sonstige:0};
  etfs.forEach(function(e){
    var cd=COUNTRY[e.isin]; if(!cd) return;
    var w=e.wert/total;
    if(cd.USA)       res.USA       += w*cd.USA;
    if(cd.Europa)    res.Europa    += w*cd.Europa;
    if(cd.Japan)     res.Japan     += w*cd.Japan;
    if(cd.Kanada)    res.Kanada    += w*cd.Kanada;
    if(cd.Australien)res.Australien+= w*cd.Australien;
    if(cd.Sonstige)  res.Sonstige  += w*cd.Sonstige;
    if(cd.EM) {
      // split EM: ~30% China, ~70% rest (India, SE-Asia, Brazil, etc.)
      res.China   += w*cd.EM*0.30;
      res.EM_Rest += w*cd.EM*0.70;
    }
  });
  return res;
}

function calcSectors(etfs) {
  var total=etfs.reduce(function(a,e){return a+e.wert;},0);
  var res={};
  etfs.forEach(function(e){
    var sd=SECTORS[e.isin]; if(!sd) return;
    var w=e.wert/total;
    Object.keys(sd).forEach(function(k){ res[k]=(res[k]||0)+w*sd[k]; });
  });
  return res;
}

function calcHoldings(etfs,n) {
  var total=etfs.reduce(function(a,e){return a+e.wert;},0);
  var merged={};
  etfs.forEach(function(e){
    var hh=HOLDINGS[e.isin]||[]; var w=e.wert/total;
    hh.forEach(function(h){
      if(!merged[h.n]) merged[h.n]={n:h.n,t:h.t,s:h.s,pct:0,etfs:[]};
      merged[h.n].pct+=h.p*w;
      if(merged[h.n].etfs.indexOf(e.name)<0) merged[h.n].etfs.push(e.name);
    });
  });
  return Object.values(merged).sort(function(a,b){return b.pct-a.pct;}).slice(0,n||30);
}

function getSnapForPeriod(months) {
  if(snapshots.length<2) return null;
  var latest=snapshots[snapshots.length-1];
  var target=new Date(latest.date); target.setMonth(target.getMonth()-months);
  var best=null,bestD=Infinity;
  for(var i=0;i<snapshots.length-1;i++){
    var d=Math.abs(new Date(snapshots[i].date)-target);
    if(d<bestD){bestD=d;best=snapshots[i];}
  }
  return best&&bestD<45*86400000?{from:best,to:snapshots[snapshots.length-1]}:null;
}

function renderEntwicklung() {
  var el=document.getElementById('tab-entwicklung');
  if(!snapshots.length){el.innerHTML='<div class="no-data">Keine Daten vorhanden.</div>';return;}
  var snap=snapshots[snapshots.length-1];
  var total=snap.etfs.reduce(function(a,e){return a+e.wert;},0);
  var period=PERIODS[activePeriod];
  var pair=getSnapForPeriod(period.m);
  var manual=manualData[period.l]||{};

  var btnH='';
  PERIODS.forEach(function(p,i){
    var has=!!getSnapForPeriod(p.m)||Object.keys(manualData[p.l]||{}).length>0;
    btnH+='<button class="period-btn'+(i===activePeriod?' active':'')+'" data-period="'+i+'">'+(has?'● ':'')+p.l+'</button>';
  });

  var etfData=snap.etfs.map(function(e){
    var gPct=null,src='none';
    if(pair){var fe=pair.from.etfs.filter(function(x){return x.isin===e.isin;})[0];if(fe){gPct=(e.gewinnPct||0)-(fe.gewinnPct||0);src='snapshot';}}
    if(src==='none'&&manual[e.isin]!==undefined){gPct=manual[e.isin];src='manual';}
    return {name:e.name,isin:e.isin,wert:e.wert,gewinnPct:e.gewinnPct,gewinnEur:e.gewinnEur,monate:e.monate,einstand:e.einstand,firstBuy:e.firstBuy,pGewinn:gPct,src:src};
  });

  var known=etfData.filter(function(e){return e.pGewinn!==null;});
  var totPct=known.length?known.reduce(function(a,e){return a+(e.wert/total)*e.pGewinn;},0):null;

  var s1=snapshots[snapshots.length-2], s2=snapshots[snapshots.length-1];
  var c1=calcSnap(s1), c2=calcSnap(s2);
  var rows=[
    ['Portfolio-Wert',fmt(c1.total),fmt(c2.total),c2.total-c1.total,false,'EUR'],
    ['S1 IT',c1.s1pct.toFixed(1)+'%',c2.s1pct.toFixed(1)+'%',c2.s1pct-c1.s1pct,true,'pp'],
    ['S2 adj.',c1.s2pct.toFixed(1)+'%',c2.s2pct.toFixed(1)+'%',c2.s2pct-c1.s2pct,true,'pp'],
    ['Gewinn brutto',fmt(c1.gewinnEur),fmt(c2.gewinnEur),c2.gewinnEur-c1.gewinnEur,false,'EUR'],
    ['Gewinn netto',fmt(c1.netto),fmt(c2.netto),c2.netto-c1.netto,false,'EUR'],
    ['CAGR brutto',c1.cagr.toFixed(2)+'%',c2.cagr.toFixed(2)+'%',c2.cagr-c1.cagr,false,'pp'],
  ];
  var h='<div style="margin-bottom:14px"><div style="font-size:13px;font-weight:600">'+(s1.note||s1.date)+' → '+(s2.note||s2.date)+'</div></div>';
  h+='<div class="card"><table><thead><tr><th>Kennzahl</th><th>'+s1.date+'</th><th>'+s2.date+'</th><th>Veraenderung</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var delta=r[3],negGood=r[4],unit=r[5];
    var better=negGood?delta<=0:delta>=0;
    var cls=delta===0?'color:var(--muted)':better?'color:var(--green)':'color:var(--danger)';
    var arrow=delta>0?'▲ +':delta<0?'▼ ':'→ ';
    var dv=unit==='EUR'?arrow+fmt(Math.abs(delta)):arrow+Math.abs(delta).toFixed(2)+' '+unit;
    h+='<tr><td><strong>'+r[0]+'</strong></td><td style="color:var(--muted)">'+r[1]+'</td><td>'+r[2]+'</td><td style="'+cls+';font-weight:600">'+dv+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="card"><table><thead><tr><th>ETF</th><th>'+s1.date+'</th><th>'+s2.date+'</th><th>Delta Wert</th><th>Gewinn vorher</th><th>Gewinn nachher</th><th>Delta</th></tr></thead><tbody>';
  s2.etfs.forEach(function(e2){
    var e1=(s1.etfs||[]).filter(function(x){return x.isin===e2.isin;})[0]; if(!e1) return;
    var dw=e2.wert-e1.wert, dg=(e2.gewinnPct||0)-(e1.gewinnPct||0);
    h+='<tr><td><strong>'+e2.name+'</strong></td><td style="color:var(--muted)">'+fmt(e1.wert)+'</td><td>'+fmt(e2.wert)+'</td>';
    h+='<td class="'+(dw>=0?'c-green':'c-danger')+'">'+(dw>=0?'▲ +':'▼ ')+fmt(Math.abs(dw))+'</td>';
    h+='<td style="color:var(--muted)">+'+((e1.gewinnPct||0).toFixed(2))+'%</td><td class="c-green">+'+((e2.gewinnPct||0).toFixed(2))+'%</td>';
    h+='<td class="'+(dg>=0?'c-green':'c-danger')+'">'+(dg>=0?'+':'')+dg.toFixed(2)+'pp</td></tr>';
  });
  h+='</tbody></table></div>';
  el.innerHTML=h;
}

function getV(id){var e=document.getElementById(id);if(!e||e.value==='')return null;var v=parseFloat(e.value);return isNaN(v)?null:v;}

function computeAlloc(etfs) {
  var inv=parseFloat(document.getElementById('sim-total').value)||0;
  var total=etfs.reduce(function(a,e){return a+e.wert;},0);
  var factors={};
  document.querySelectorAll('.sim-prio').forEach(function(s){
    var pr=PRIO.filter(function(p){return p.v===s.value;})[0]||PRIO[2];
    factors[s.getAttribute('data-isin')]=pr.f;
  });
  var tw=0;
  etfs.forEach(function(e){var base=distMode==='equal'?1:e.wert/total;tw+=base*(factors[e.isin]||0);});
  var alloc={};
  etfs.forEach(function(e){var base=distMode==='equal'?1:e.wert/total;alloc[e.isin]=tw>0?inv*(base*(factors[e.isin]||0)/tw):0;});
  return {alloc:alloc,total:inv};
}

function updateSim(etfs) {
  var res=computeAlloc(etfs);
  var alloc=res.alloc;
  var inv=res.total;
  var totalB=etfs.reduce(function(a,e){return a+e.wert;},0);
  var totalA=etfs.reduce(function(a,e){return a+e.wert+(alloc[e.isin]||0);},0);
  var pl=document.getElementById('sim-planned');
  if(pl) pl.textContent=fmt(inv).replace('€','')+'EUR';
  // Update per-ETF display
  etfs.forEach(function(e){
    var add=alloc[e.isin]||0;
    var rd=document.querySelector('.sim-etf-res[data-isin="'+e.isin+'"]');
    if(!rd) return;
    var prio=document.querySelector('.sim-prio[data-isin="'+e.isin+'"]');
    var pv=prio?prio.value:'neutral';
    var pr=PRIO.filter(function(p){return p.v===pv;})[0]||PRIO[2];
    if(add>0) rd.innerHTML='<span style="color:'+pr.c+';font-weight:600">+'+fmt(add)+'</span><br>+'+(add/totalB*100).toFixed(1)+'% PF';
    else rd.textContent='–';
  });
  // Build sim etfs
  var simEtfs=etfs.map(function(e){return {name:e.name,isin:e.isin,wert:e.wert+(alloc[e.isin]||0)};});
  var geoB=calcGeo(etfs),geoA=calcGeo(simEtfs);
  var secB=calcSectors(etfs),secA=calcSectors(simEtfs);
  var s1B=etfs.reduce(function(a,e){var t=TECH[e.isin]||{s1:0};return a+e.wert*t.s1/100;},0)/totalB*100;
  var s1A=simEtfs.reduce(function(a,e){var t=TECH[e.isin]||{s1:0};return a+e.wert*t.s1/100;},0)/totalA*100;
  var s2B=etfs.reduce(function(a,e){var t=TECH[e.isin]||{s1:0,s2a:0};return a+e.wert*(t.s1+t.s2a)/100;},0)/totalB*100;
  var s2A=simEtfs.reduce(function(a,e){var t=TECH[e.isin]||{s1:0,s2a:0};return a+e.wert*(t.s1+t.s2a)/100;},0)/totalA*100;
  var warns=[];
  var limU=getV('lim-usa'),limE=getV('lim-europa'),limJ=getV('lim-japan'),limEM=getV('lim-em'),limS=getV('lim-sonstige');
  if(limU!==null&&geoA.USA>limU) warns.push('USA '+geoA.USA.toFixed(1)+'% > '+limU+'%');
  if(limE!==null&&geoA.Europa>limE) warns.push('Europa '+geoA.Europa.toFixed(1)+'% > '+limE+'%');
  if(limJ!==null&&geoA.Japan>limJ) warns.push('Japan '+geoA.Japan.toFixed(1)+'% > '+limJ+'%');
  if(limEM!==null&&geoA.EM>limEM) warns.push('EM '+geoA.EM.toFixed(1)+'% > '+limEM+'%');
  if(limS!==null&&geoA.Sonstige>limS) warns.push('Sonstige '+geoA.Sonstige.toFixed(1)+'% > '+limS+'%');
  document.querySelectorAll('.sim-s-lim').forEach(function(inp){
    var k=inp.getAttribute('data-sec'); var lim=parseFloat(inp.value);
    if(!isNaN(lim)&&(secA[k]||0)>lim) warns.push(SECTOR_LABELS[k]+' '+(secA[k]||0).toFixed(1)+'% > '+lim+'%');
  });
  var allOk=warns.length===0;
  var scale=50;
  function simBar(b,a,col,lim){
    var bB=Math.min(b/scale*100,100).toFixed(1);
    var bA=Math.min(a/scale*100,100).toFixed(1);
    var bL=lim!==null?Math.min(lim/scale*100,100).toFixed(1):null;
    var over=lim!==null&&a>lim;
    return '<div class="sim-bar"><div class="sim-bar-b" style="width:'+bB+'%"></div><div class="sim-bar-a" style="width:'+bA+'%;background:'+(over?'var(--danger)':col)+'"></div>'+(bL?'<div class="sim-bar-lim" style="left:'+bL+'%"></div>':'')+'</div>';
  }
  function cmpRow(lbl,b,a,col,lim){
    var d=a-b,over=lim!==null&&a>lim;
    var dC=d>0.05?'var(--green)':d<-0.05?'var(--danger)':'var(--muted)';
    return '<div class="sim-cmp-row"><span>'+lbl+(over?'<span class="warn-badge" style="margin-left:4px">⚠</span>':'')+'</span>'+simBar(b,a,col,lim)+'<span style="color:var(--muted);text-align:right">'+b.toFixed(1)+'%</span><span style="color:'+(over?'var(--danger)':col)+';font-weight:600;text-align:right">'+a.toFixed(1)+'%</span><span style="color:'+dC+';text-align:right">'+(d>=0?'+':'')+d.toFixed(1)+'</span></div>';
  }

  var pills='';
  if(inv>0){etfs.forEach(function(e){var add=alloc[e.isin]||0;if(add<=0) return;var prio=document.querySelector('.sim-prio[data-isin="'+e.isin+'"]');var pv=prio?prio.value:'neutral';var pr=PRIO.filter(function(p){return p.v===pv;})[0]||PRIO[2];pills+='<div style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 9px;font-size:10px">'+e.name+' <span style="color:'+pr.c+'">'+pr.l+'</span>: <strong class="c-green">+'+fmt(Math.round(add))+'</strong></div>';});}

  var h='<div class="sim-result">';
  h+='<h3>Simulation Nachkauf'+(inv>0?' <span style="font-size:11px;color:var(--muted);font-weight:400">+'+fmt(inv)+' → '+fmt(Math.round(totalA))+' gesamt</span>':'')+(allOk&&inv>0?'<span class="ok-badge">Alle Limits OK</span>':'')+'</h3>';
  if(warns.length) h+='<div class="warn-box">'+warns.join(' · ')+'</div>';
  if(pills) h+='<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px">'+pills+'</div>';
  h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;padding:12px;background:var(--surface2);border-radius:7px">';
  h+='<div><div style="font-size:9px;color:var(--muted);text-transform:uppercase">Portfolio nach Kauf</div><div style="font-size:18px;font-weight:700;color:var(--accent)">'+fmt(Math.round(totalA))+'</div></div>';
  h+='<div><div style="font-size:9px;color:var(--muted);text-transform:uppercase">S1 nach Kauf</div><div style="font-size:18px;font-weight:700;color:'+(s1A<=20?'var(--green)':'var(--danger)')+'">'+s1A.toFixed(1)+'%</div></div>';
  h+='<div><div style="font-size:9px;color:var(--muted);text-transform:uppercase">S2 nach Kauf</div><div style="font-size:18px;font-weight:700;color:'+(s2A<=30?'var(--warn)':'var(--danger)')+'">'+s2A.toFixed(1)+'%</div></div>';
  h+='</div>';
  h+='<div style="font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;margin-bottom:5px">Tech S1/S2</div>';
  h+='<div style="margin-bottom:14px"><div class="sim-cmp-row hdr"><span>Schicht</span><span>Verlauf</span><span style="text-align:right">Vorher</span><span style="text-align:right">Nachher</span><span style="text-align:right">Delta</span></div>';
  h+=cmpRow('S1 – IT offiziell',s1B,s1A,'var(--s1)',getV('lim-s-it')||20);
  h+=cmpRow('S2 – IT + Komm.',s2B,s2A,'var(--s2)',null);
  h+='</div>';
  h+='<div style="font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;margin-bottom:5px">Regionen</div>';
  h+='<div style="margin-bottom:14px"><div class="sim-cmp-row hdr"><span>Region</span><span>Verlauf</span><span style="text-align:right">Vorher</span><span style="text-align:right">Nachher</span><span style="text-align:right">Delta</span></div>';
  h+=cmpRow('USA',geoB.USA,geoA.USA,'#4f8ef7',limU);
  h+=cmpRow('Europa',geoB.Europa,geoA.Europa,'#4caf87',limE);
  h+=cmpRow('Japan',geoB.Japan,geoA.Japan,'#e8a838',limJ);
  h+=cmpRow('China',geoB.China,geoA.China,'#dc5050',0);
  h+=cmpRow('EM Rest',geoB.EM_Rest,geoA.EM_Rest,'#7c5cbf',limEM);
  h+=cmpRow('Sonstige',geoB.Sonstige,geoA.Sonstige,'#7a8099',limS);
  h+='</div>';
  h+='<div style="font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;margin-bottom:5px">Alle 11 Sektoren</div>';
  h+='<div><div class="sim-cmp-row hdr"><span>Sektor</span><span>Verlauf</span><span style="text-align:right">Vorher</span><span style="text-align:right">Nachher</span><span style="text-align:right">Delta</span></div>';
  var sKeys2=Object.keys(SECTOR_LABELS).sort(function(a,b){return (secA[b]||0)-(secA[a]||0);});
  sKeys2.forEach(function(k){
    var b=secB[k]||0,a=secA[k]||0;
    var lim=null;
    document.querySelectorAll('.sim-s-lim').forEach(function(inp){if(inp.getAttribute('data-sec')===k)lim=parseFloat(inp.value)||null;});
    h+=cmpRow(SECTOR_LABELS[k],b,a,SECTOR_COLORS[k]||'var(--muted)',lim);
  });
  h+='</div>';
  h+='<div style="font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;margin-bottom:5px;margin-top:14px">ETF-Anteile</div>';
  h+='<div><div class="sim-cmp-row hdr"><span>ETF</span><span>Verlauf</span><span style="text-align:right">Vorher</span><span style="text-align:right">Nachher</span><span style="text-align:right">Invest</span></div>';
  etfs.forEach(function(e){
    var add=alloc[e.isin]||0;
    var wB=e.wert/totalB*100,wA=(e.wert+add)/totalA*100;
    h+=cmpRow(e.name,wB,wA,'var(--accent)',null).replace('</div>','<span style="font-size:10px;text-align:right;color:'+(add>0?'var(--green)':'var(--muted)')+'">'+( add>0?'+'+fmt(Math.round(add)):'–')+'</span></div>');
  });
  h+='</div></div>';
  document.getElementById('sim-result').innerHTML=h;
}

function importFromJSON() {
  var ta = document.getElementById("json-paste");
  var statusEl = document.getElementById("screenshot-status");
  if(!ta||!ta.value.trim()){toast("Bitte JSON einfugen",true);return;}
  try {
    var text = ta.value.trim().split("```json").join("").split("```").join("").trim();
    var positions = JSON.parse(text);
    var matched = 0;
    positions.forEach(function(pos){
      var posName = (pos.name||"").toLowerCase();
      document.querySelectorAll(".csv-row").forEach(function(tr){
        var nc = tr.querySelector("td:first-child");
        if(!nc) return;
        var rowName = nc.textContent.trim().toLowerCase();
        var words = rowName.split(" ").filter(function(w){return w.length>=4;});
        var hit = words.some(function(w){return posName.indexOf(w)>=0;});
        if(!hit&&pos.isin){var ic=tr.querySelector("td:nth-child(2)");if(ic&&ic.textContent.trim()===pos.isin)hit=true;}
        if(hit){
          var we=tr.querySelector(".f-wert"),ge=tr.querySelector(".f-geur");
          if(we&&pos.wert!==undefined){we.value=pos.wert;we.dispatchEvent(new Event("input"));}
          if(ge&&pos.gewinnEur!==undefined){ge.value=pos.gewinnEur;ge.dispatchEvent(new Event("input"));}
          matched++;
        }
      });
    });
    if(statusEl){statusEl.style.color="var(--green)";statusEl.textContent=positions.length+" Positionen - "+matched+" Felder ausgefullt.";}
    toast(matched+" Felder ausgefullt!");
  } catch(e){toast("JSON ungultig: "+e.message,true);}
}

async function saveSnap() {
  var date=document.getElementById('f-date').value;
  var note=document.getElementById('f-note').value.trim();
  if(!date){toast('Bitte Datum angeben',true);return;}
  var etfs=[];
  document.querySelectorAll('.csv-row').forEach(function(tr){
    var isin=tr.getAttribute('data-isin');
    var pos=CSV_IMPORT[isin]; if(!pos) return;
    var wert=parseFloat(tr.querySelector('.f-wert').value);
    if(isNaN(wert)||wert<=0) return;
    // Use TR's absolute gewinnEur directly - most accurate
    var gEurEl = tr.querySelector('.f-geur');
    var gEur = gEurEl ? (parseFloat(gEurEl.value) || 0) : 0;
    var gPct = (wert - gEur) > 0 ? gEur / (wert - gEur) * 100 : 0;
    var today=new Date(); var fb=new Date(pos.firstBuy);
    var monate=Math.round((today-fb)/(1000*60*60*24*30.44));
    etfs.push({name:pos.name,isin:pos.isin,wert:Math.round(wert*100)/100,gewinnPct:Math.round(gPct*100)/100,gewinnEur:Math.round(gEur*100)/100,monate:monate,einstand:pos.einstand,netShares:pos.netShares,avgPrice:pos.avgPrice,firstBuy:pos.firstBuy,source:'csv'});
  });
  document.querySelectorAll('.manual-row').forEach(function(tr){
    var name=tr.querySelector('.f-mn').value.trim();
    var isin=tr.querySelector('.f-mi').value.trim().toUpperCase();
    var wert=parseFloat(tr.querySelector('.f-mw').value);
    var einstand=parseFloat(tr.querySelector('.f-me').value)||0;
    var monate=parseInt(tr.querySelector('.f-mm').value)||0;
    var firstBuy=tr.querySelector('.f-mf').value||'';
    if(!name||!isin||isNaN(wert)||wert<=0) return;
    var gEur=einstand>0?wert-einstand:0;
    var gPct=einstand>0?gEur/einstand*100:0;
    etfs.push({name:name,isin:isin,wert:Math.round(wert*100)/100,gewinnPct:Math.round(gPct*100)/100,gewinnEur:Math.round(gEur*100)/100,monate:monate,einstand:einstand,firstBuy:firstBuy,source:'manual'});
  });
  if(!etfs.length){toast('Bitte mindestens einen Wert eintragen',true);return;}
  snapshots.push({date:date,note:note,etfs:etfs});
  await persist();
  toast('Snapshot gespeichert! ('+etfs.length+' Positionen)');
  showTab('analyse');
}

async function handleCSV(file) {
  var text=await file.text();
  var lines=text.split('\n').filter(function(l){return l.trim();});
  var headers=lines[0].split(',').map(function(h){return h.trim().replace(/"/g,'');});
  var positions={};
  lines.slice(1).forEach(function(line){
    var vals=[],cur='',inQ=false;
    for(var ci=0;ci<line.length;ci++){var ch=line[ci];if(ch==='"'){inQ=!inQ;}else if(ch===','&&!inQ){vals.push(cur);cur='';}else{cur+=ch;}}
    vals.push(cur);
    var row={};
    headers.forEach(function(h,i){row[h]=(vals[i]||'').trim().replace(/"/g,'');});
    if(row.asset_class!=='FUND'||!row.symbol) return;
    // Exclude sold/irrelevant positions
    var IGNORE_ISINS = ['IE000I7E6HL0','IE000OJ5TQP4','IE00B4NCWG09','BTC'];
    if(IGNORE_ISINS.indexOf(row.symbol)>=0) return;
    if(!positions[row.symbol]) positions[row.symbol]={name:row.name,buys:[],sells:[]};
    var sh=parseFloat(row.shares)||0,am=parseFloat(row.amount)||0,fe=parseFloat(row.fee)||0;
    if(row.type==='BUY') positions[row.symbol].buys.push({shares:sh,amount:am,fee:fe,date:row.date});
    if(row.type==='SELL') positions[row.symbol].sells.push({shares:sh,date:row.date});
  });
  var today=new Date(); var count=0;
  Object.keys(positions).forEach(function(sym){
    var pos=positions[sym];
    var netSh=pos.buys.reduce(function(a,b){return a+b.shares;},0)+pos.sells.reduce(function(a,b){return a+b.shares;},0);
    if(netSh<=0.001) return;
    var totalCost=pos.buys.reduce(function(a,b){return a+Math.abs(b.amount)+Math.abs(b.fee);},0);
    var totSh=pos.buys.reduce(function(a,b){return a+b.shares;},0);
    // Correct: only count cost of REMAINING shares (after sells)
    var einstand=totSh>0?totalCost*(netSh/totSh):0;
    var avg=totSh>0?totalCost/totSh:0;
    var fb=pos.buys.length?pos.buys.sort(function(a,b){return a.date.localeCompare(b.date);})[0].date.split('T')[0]:'';
    var monate=fb?Math.round((today-new Date(fb))/(1000*60*60*24*30.44)):0;
    CSV_IMPORT[sym]={isin:sym,name:(pos.name||sym).substring(0,35),netShares:Math.round(netSh*1e6)/1e6,einstand:Math.round(einstand*100)/100,avgPrice:Math.round(avg*100)/100,firstBuy:fb,monate:monate};
    count++;
  });
  var st=document.getElementById('csv-status');
  if(st) st.textContent='Import: '+new Date().toLocaleDateString('de-DE')+' · '+count+' Positionen';
  toast('CSV importiert! '+count+' Positionen');
  buildErfassenRows(snapshots.length?snapshots[snapshots.length-1]:null);
}

// ── VERLAUF ───────────────────────────────────────────────────────────
function renderVerlauf() {
  var el=document.getElementById('tab-verlauf');
  if(!snapshots.length){el.innerHTML='<div class="no-data">Keine Snapshots.</div>';return;}
  var h='';
  var rev=snapshots.slice().reverse();
  rev.forEach(function(snap,ri){
    var i=snapshots.length-1-ri;
    var c=calcSnap(snap);
    var prev=i>0?calcSnap(snapshots[i-1]):null;
    var delta=prev?c.total-prev.total:null;
    h+='<div class="snap-card">';
    h+='<div class="snap-head" style="flex-wrap:wrap;gap:6px"><div><div class="snap-date">'+snap.date+(snap.note?' · '+snap.note:'')+'</div>';
    h+='<div style="font-size:10px;color:var(--muted);margin-top:2px">'+snap.etfs.length+' Positionen'+(delta!==null?' · <span class="'+(delta>=0?'delta-pos':'delta-neg')+'">'+fmtA(delta)+'</span>':'')+'</div></div>';
    h+='<div style="text-align:right"><div class="snap-total">'+fmt(c.total)+'</div><div style="font-size:10px;color:var(--muted)">S1: '+c.s1pct.toFixed(1)+'% · S2: '+c.s2pct.toFixed(1)+'%</div></div></div>';
    h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px">';
    h+='<div><div style="font-size:9px;color:var(--muted)">Brutto-Gewinn</div><div class="c-green" style="font-weight:600">+'+fmt(c.gewinnEur)+'</div></div>';
    h+='<div><div style="font-size:9px;color:var(--muted)">Steuer</div><div style="color:var(--warn)">−'+fmt(c.steuer)+'</div></div>';
    h+='<div><div style="font-size:9px;color:var(--muted)">Netto</div><div class="c-green" style="font-weight:600">+'+fmt(c.netto)+'</div></div></div>';
    h+='<div class="snap-pills">';
    snap.etfs.forEach(function(e){h+='<div class="pill">'+e.name+': <strong>'+fmt(e.wert)+'</strong> <span class="c-green">+'+(e.gewinnPct||0).toFixed(1)+'%</span></div>';});
    h+='</div>';
    h+='<div style="text-align:right;margin-top:8px"><button class="btn-danger-sm del-snap" data-idx="'+i+'">Loeschen</button></div>';
    h+='</div>';
  });
  el.innerHTML=h;
}

// ── EVENT DELEGATION ──────────────────────────────────────────────────
document.addEventListener('click', function(e) {
  // Rendite toggle
  var toggle = e.target.closest('#rendite-toggle');
  if(toggle) {
    var body = document.getElementById('rendite-body');
    var chevron = document.getElementById('rendite-chevron');
    if(body) {
      var open = body.style.display !== 'none';
      body.style.display = open ? 'none' : 'block';
      if(chevron) chevron.style.transform = open ? '' : 'rotate(180deg)';
    }
    return;
  }

  var tab=e.target.closest('[data-tab]');
  if(tab){showTab(tab.getAttribute('data-tab'));return;}

  var period=e.target.closest('[data-period]');
  if(period){activePeriod=parseInt(period.getAttribute('data-period'));renderEntwicklung();return;}

  var action=e.target.closest('[data-action]');
  if(action){
    var act=action.getAttribute('data-action');
    var pl=action.getAttribute('data-plabel');
    if(act==='saveManual'){
      if(!manualData[pl]) manualData[pl]={};
      document.querySelectorAll('.manual-inp').forEach(function(inp){var v=parseFloat(inp.value);if(!isNaN(v)) manualData[pl][inp.getAttribute('data-isin')]=v;});
      saveManual(); toast('Gespeichert!'); renderEntwicklung(); return;
    }
    if(act==='clearManual'){delete manualData[pl];saveManual();renderEntwicklung();return;}
    if(act==='remove-row'){e.target.closest('tr').remove();return;}
  }

  if(e.target.id==='btn-import-json'){importFromJSON();return;}
  if(e.target.id==='btn-save-snap'){saveSnap();return;}
  if(e.target.id==='btn-add-row'){addManualRow();return;}
  if(e.target.id==='dist-equal'){
    distMode='equal';
    var de=document.getElementById('dist-equal'),dp=document.getElementById('dist-prop');
    if(de){de.style.background='var(--accent)';de.style.color='#fff';}
    if(dp){dp.style.background='var(--surface2)';dp.style.color='var(--muted)';}
    var sn=snapshots.length?snapshots[snapshots.length-1]:null;
    if(sn) updateSim(sn.etfs); return;
  }
  if(e.target.id==='dist-prop'){
    distMode='prop';
    var de2=document.getElementById('dist-equal'),dp2=document.getElementById('dist-prop');
    if(de2){de2.style.background='var(--surface2)';de2.style.color='var(--muted)';}
    if(dp2){dp2.style.background='var(--accent)';dp2.style.color='#fff';}
    var sn2=snapshots.length?snapshots[snapshots.length-1]:null;
    if(sn2) updateSim(sn2.etfs); return;
  }
  if(e.target.classList.contains('del-snap')){
    var idx=parseInt(e.target.getAttribute('data-idx'));
    if(confirm('Snapshot loeschen?')){snapshots.splice(idx,1);persist();renderVerlauf();}
    return;
  }
});

  if(e.target.id==='screenshot-upload'&&e.target.files.length) handleScreenshot(e.target.files[0]);

});

document.addEventListener('input', function(e) {
  if(e.target.id==='sim-total'||e.target.classList.contains('sim-prio')||e.target.classList.contains('clim')){
    var sn=snapshots.length?snapshots[snapshots.length-1]:null;

    var isin=e.target.getAttribute('data-isin');
    var wertEl=document.querySelector('.f-wert[data-isin="'+isin+'"]');
    var geurEl=document.querySelector('.f-geur[data-isin="'+isin+'"]');
    var hint=document.querySelector('.calc-hint[data-isin="'+isin+'"]');
    if(!wertEl||!geurEl||!hint) return;
    var wert=parseFloat(wertEl.value); var gEur=parseFloat(geurEl.value);
    if(isNaN(wert)||isNaN(gEur)) return;
    var einstand=wert-gEur;
    var pct=einstand>0?gEur/einstand*100:0;
    hint.style.color=gEur>=0?'var(--green)':'var(--danger)';
    hint.textContent=(gEur>=0?'+':'')+gEur.toFixed(2)+'EUR ('+pct.toFixed(2)+'%) · Einstand ~'+Math.round(einstand)+'EUR';
  }
});

Promise.all([loadData(),loadManual()]).then(function(){
  // Setze Data-Timestamp falls nicht vorhanden oder älter als eingebettetes Datum
  getDataAge().then(function(existing){
    var embedded = new Date(EMBEDDED_DATA_DATE);

      markDataUpdated();
    }

  renderAnalyse();
}).catch(function(){
  snapshots=JSON.parse(JSON.stringify(SNAPSHOTS_DEFAULT));
  renderAnalyse();
});
